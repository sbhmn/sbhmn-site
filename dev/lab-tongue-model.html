<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>SBHMN lab: tongue model</title>
<link rel="icon" href="data:,">
<!-- Test bench for assets/intro/tongue-model.js (the owner's tongue model, rigged; not linked from the site): the
     intro's bin with the lid SHUT (as after the slam, the black monster block under it), the tongue squeezing out
     through the gap under the lid's edge (anywhere round it: its base rides the gap like a track), the lid riding on it
     (the module's lid(pitch) and roll(r) drive the lid here, nested as in intro.js: a pitch group at the hinge, a roll
     group on the lid's side edge inside it).
     /dev/lab-tongue-model.html            live: licks every 4 s; click or space to lick now, M mirrors the next one
     ?view=lick,lickp,front (default) | throw | phone | front | lick | lickp | side | left | top | close | low
                                          | tclose | fclose | pclose | cam | any list: which camera(s), side by side.
                                          throw = the throw camera (landscape; the lick starts in front of it),
                                          phone = the throw camera on a portrait phone (aspect 0.46: it backs off so
                                          the bin fits), lick / lickp = the camera the intro cranes up to for the lick
                                          (intro.js's view.lick: 32 degrees down, framing everything the tongue does;
                                          &el, &az: other angles), landscape / on a portrait phone, front = the
                                          intro's front camera (reference),
                                          side = from the right, left = from the left, top = from above, close =
                                          nearer, low = low and near, tclose / fclose / pclose
                                          = the throw / front / phone camera zoomed in on the gap; cam = your own:
                                          &cam=x,y,z,targetX,targetY,targetZ,fov in bin space
     &shot                                no loop: dev/tongue-model-shot.cjs steps it with __stage.advance(s); the lick
                                          starts at scene time &at (default 0.1)
     &speed=1  &mirror                    lick options
     &bones                               draw the chain (joints, and each one's top as a tick)
     &pose=0.5                            freeze the tongue in the lick's pose at that time (no drips, the lid at the
                                          push), for look-dev
     &set=bend:-1,out:0.5                 ... with some of the pose's numbers overridden
     &notilt                              lick() without roll: the lid is not tipped (the whole lid hinges up where the
                                          tongue comes out), as an intro that only maps lid(pitch) would show it
     &tm=clearcoat:0,roughness:0.5        override tongue material numbers
     &fxscene                             the drips live in the scene (opts.fxParent = scene)
     &glb=/path/to.glb                    another build of the model
     &cold                                no warm() before the first lick
     &nocollide                           the raw chain (keyframes + springs), not kept off the bin and the lid
     &nomonster                           no black block under the lid
     &map | &uvgrid                       the colour map unlit | a labelled UV grid on the tongue
     &fill=0.85                           how much of the groove is filled (the module's FILL)
     __stage.advance(s), .sheet(times), .poseSheet([{ t, set, label }]), .check(), .contact()   for the scripts
                                          (check: vertices through the bin or the lid; contact: how close it lies to
                                          each face it is nearest, by the module's own distance fields) -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 monospace; color: #888; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas></canvas>
<div class="hud"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '/assets/vendor/three/addons/loaders/GLTFLoader.js';
  import { createTongue } from '/assets/intro/tongue-model.js';
  const q = new URLSearchParams(location.search);
  const views = (q.get('view') ?? 'lick,lickp,front').split(',');
  const shot = q.has('shot'), lickAt = +(q.get('at') ?? 0.1);
  const canvas = document.querySelector('canvas');
  const hud = document.querySelector('.hud');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: shot });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(-2.2, 5, 3.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 12 });
  sun.shadow.radius = 4;
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.13 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // the bin, as intro.js builds it: the lid on a pitch group at its hinge, shut; the black monster block under it
  const gltf = await new GLTFLoader().loadAsync('/assets/3d/bin.glb');
  const binMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.75, metalness: 0, flatShading: true });
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
  const pitchBlack = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
  const bin = new THREE.Group();
  scene.add(bin);
  const parts = {};
  gltf.scene.traverse((o) => { if (o.isMesh) parts[o.name] = o; });
  for (const name of ['body', 'rim', 'base', 'wheels', 'inside']) {
    const m = parts[name]; if (!m) continue;
    m.material = name === 'inside' ? voidMat : binMat;
    m.castShadow = name !== 'inside'; m.receiveShadow = true;
    bin.add(m);
  }
  // (as in intro.js: the pitch group at the hinge, the roll group at the lid's left edge inside it; the lid tips toward
  // the tongue: about its left edge when the right side rises, about its right edge when the left side does)
  const lidMesh = parts.lid;
  const pitch = new THREE.Group(); pitch.position.copy(lidMesh.position); bin.add(pitch);
  const rollG = new THREE.Group(); rollG.position.set(-0.51, 0, 0); pitch.add(rollG);
  lidMesh.position.set(0.51, 0, 0); lidMesh.material = binMat; lidMesh.castShadow = true; lidMesh.receiveShadow = true; rollG.add(lidMesh);
  const setRoll = (r) => { const px = r < 0 ? 0.51 : -0.51; rollG.position.x = px; lidMesh.position.x = -px; rollG.rotation.z = r; };
  const lining = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.98), pitchBlack);
  lining.rotation.x = Math.PI / 2; lining.position.set(0, -0.002, 0.5); lidMesh.add(lining);
  pitch.rotation.x = 0;
  if (!q.has('nomonster')) {
    const block = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.5, 0.74), pitchBlack);
    block.position.set(0, 0.775 - 0.25, 0);
    bin.add(block);
  }

  // the tongue
  const cues = [];
  let clock = 0;
  const tongue = createTongue(THREE, { ...(q.get('glb') ? { url: q.get('glb') } : {}), rimY: 0.78, fxParent: q.has('fxscene') ? scene : null, onCue: (name, info) => { if (name !== 'splat') cues.push(`${(clock - lickAt).toFixed(2)} ${name}${info?.strength != null ? ' ' + info.strength.toFixed(2) : ''}`); } });
  bin.add(tongue.object3d);
  tongue.object3d.position.set(0, 0.78, 0);
  await tongue.ready;
  const dbg = tongue.debug, tmesh = dbg.mesh;
  if (q.has('nocollide')) dbg.flags.collide = false;
  if (q.has('fill') && tmesh?.material.userData.uFill) tmesh.material.userData.uFill.value = +q.get('fill');
  if (q.get('tm') && tmesh) {
    const m = tmesh.material;
    for (const kv of q.get('tm').split(',')) {
      const [k, v] = kv.split(':');
      if (k === 'tint') m.color.set(+v);
      else if (m[k]?.isVector2) m[k].set(+v, +v);
      else m[k] = +v;
    }
    m.needsUpdate = true;
  }

  // &uvgrid: the tongue in a labelled UV grid (which part of the colour map is where); &map: the colour map, unlit
  if ((q.has('uvgrid') || q.has('map')) && tmesh) {
    let tex = tmesh.material.map;
    if (q.has('uvgrid')) {
      const c = document.createElement('canvas'); c.width = c.height = 1024;
      const x = c.getContext('2d');
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
        x.fillStyle = `hsl(${(i * 8 + j) * 47 % 360}, 70%, ${45 + (i + j) % 2 * 20}%)`; x.fillRect(i * 128, j * 128, 128, 128);
        x.fillStyle = '#000'; x.font = 'bold 44px monospace'; x.fillText(`${i}${j}`, i * 128 + 30, j * 128 + 80);
      }
      tex = new THREE.CanvasTexture(c); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
    }
    tmesh.material = new THREE.MeshBasicMaterial({ map: tex });
  }

  // the chain, drawn
  let chainLine = null;
  if (q.has('bones')) {
    const n = (dbg.NJ + 1) * 2 + dbg.NJ * 2;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    chainLine = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x00a0ff, depthTest: false }));
    chainLine.renderOrder = 10; chainLine.frustumCulled = false;
    tongue.object3d.add(chainLine);
  }
  function drawChain() {
    if (!chainLine) return;
    const a = chainLine.geometry.attributes.position.array; let i = 0;
    const put = (v) => { a[i++] = v.x; a[i++] = v.y; a[i++] = v.z; };
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); put(dbg.pos[k + 1]); }
    const z = new THREE.Vector3();
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); z.set(0, 0, 0.08).applyQuaternion(dbg.rot[k]).add(dbg.pos[k]); put(z); }
    chainLine.geometry.attributes.position.needsUpdate = true;
  }

  // cameras (intro.js's view.throw / view.front); phone: the throw camera at a portrait phone's aspect
  const MARK = { left: -0.62, right: 0.6213, top: 1.076, bottom: -0.0773 };
  const PHONE = 0.46;
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  const throwAt = (aspect) => {
    const fov = 40, base = 3.9;
    const fit = 1.9 / (2 * base * Math.tan(THREE.MathUtils.degToRad(fov / 2)) * aspect);
    return base * Math.max(1, fit);
  };
  const dir = new THREE.Vector3(0, 1.25, 3.7).normalize();
  // (as intro.js's view.lick: how far back a camera at elevation el, azimuth az looking at T must be to frame every
  // point of box, margin of the frame kept clear, never further back than the throw camera; LICK_BOX, LICK_T, 32
  // degrees, a 0.04 margin: intro.js's own)
  const LICK_BOX = [-0.8, 0.74, 0.2, 1.42, -0.45, 0.8];
  function fitOrbit(el, az, T, fov, aspect, box, margin) {
    const f = new THREE.Vector3(-Math.sin(az) * Math.cos(el), -Math.sin(el), -Math.cos(az) * Math.cos(el));
    const r = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize(), u = new THREE.Vector3().crossVectors(r, f);
    const ty = (1 - margin) * Math.tan(THREE.MathUtils.degToRad(fov / 2)), tx = ty * aspect, P = new THREE.Vector3();
    let d = 0;
    for (let i = 0; i < 8; i++) {
      P.set(box[i & 1], box[2 + ((i >> 1) & 1)], box[4 + ((i >> 2) & 1)]).sub(T);
      d = Math.max(d, Math.max(Math.abs(P.dot(r)) / tx, Math.abs(P.dot(u)) / ty) - P.dot(f));
    }
    return d;
  }
  function place(name, aspect) {
    camera.aspect = aspect;
    if (name === 'lick' || name === 'lickp') { // intro.js's camera during the lick, craned up over the bin (&el, &az: degrees)
      const T = new THREE.Vector3(0, 0.8, 0.16), el = THREE.MathUtils.degToRad(+(q.get('el') ?? 32)), az = THREE.MathUtils.degToRad(+(q.get('az') ?? 0));
      const d = Math.min(throwAt(aspect), fitOrbit(el, az, T, 40, aspect, LICK_BOX, 0.04));
      camera.fov = 40;
      camera.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(d).add(T);
      camera.lookAt(T);
    } else if (name === 'throw' || name === 'phone') {
      camera.position.set(0, 0.5, 0).addScaledVector(dir, throwAt(aspect));
      camera.fov = 40; camera.lookAt(0, 0.5, 0);
    } else if (name === 'side') {
      camera.fov = 30; camera.position.set(4.2, 1.2, 0.4); camera.lookAt(0, 0.7, 0.4);
    } else if (name === 'left') {
      camera.fov = 30; camera.position.set(-4.2, 1.2, 0.6); camera.lookAt(0, 0.6, 0.3);
    } else if (name === 'top') {
      camera.fov = 30; camera.position.set(0, 4.4, 1.3); camera.lookAt(0, 0.7, 0.15);
    } else if (name === 'close') {
      camera.fov = 26; camera.position.set(0.9, 1.5, 2.8); camera.lookAt(0, 0.75, 0.45);
    } else if (name === 'cam') { // &cam=x,y,z,tx,ty,tz,fov (bin space)
      const c = (q.get('cam') || '2,1.2,2,0,0.8,0,20').split(',').map(Number);
      camera.position.set(c[0], c[1], c[2]); camera.fov = c[6]; camera.lookAt(c[3], c[4], c[5]);
    } else if (name === 'tclose' || name === 'pclose') { // the throw / phone camera's view of the gap, zoomed in
      camera.position.set(0, 0.5, 0).addScaledVector(dir, throwAt(name === 'pclose' ? PHONE : 1.7));
      camera.fov = name === 'pclose' ? 24 : 24; camera.lookAt(0, 0.68, 0.45);
    } else if (name === 'fclose') { // the front camera's view of the gap, zoomed in
      camera.position.set(0, 0.6, 8); camera.fov = 9; camera.lookAt(0, 0.7, 0);
    } else if (name === 'low') {
      camera.fov = 30; camera.position.set(0.5, 0.6, 2.3); camera.lookAt(0, 0.55, 0.5);
    } else {
      const fov = 18, t = 2 * Math.tan(THREE.MathUtils.degToRad(fov / 2));
      const h = MARK.top - MARK.bottom, w = MARK.right - MARK.left;
      const d = Math.max(h / 0.5 / t, w / 0.62 / (t * aspect));
      const cy = (MARK.top + MARK.bottom) / 2;
      camera.position.set(0, cy, d); camera.fov = fov; camera.lookAt(0, cy, 0);
    }
    camera.updateProjectionMatrix();
  }
  // each view its own width: phone views are portrait (aspect 0.46), the rest share what is left
  function layout(w, h) {
    const portrait = (v) => v === 'phone' || v === 'pclose' || v === 'lickp';
    const nPhone = views.filter(portrait).length;
    const pw = Math.round(h * PHONE), rest = views.length - nPhone;
    const ow = rest ? Math.floor((w - nPhone * pw) / rest) : 0;
    let x = 0;
    return views.map((v) => { const vw = portrait(v) ? pw : ow; const r = { v, x, w: vw }; x += vw; return r; });
  }
  function render() {
    drawChain();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cells = layout(w, h);
    renderer.setScissorTest(cells.length > 1);
    renderer.setClearColor(0xffffff);
    for (const c of cells) {
      renderer.setViewport(c.x, 0, c.w, h); renderer.setScissor(c.x, 0, c.w, h);
      place(c.v, c.w / h);
      renderer.render(scene, camera);
    }
  }
  function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
  window.addEventListener('resize', resize); resize();
  if (!q.has('cold')) { place(views[0], 1); tongue.warm(renderer, camera); } // &cold: no warm() (to time the first lick)

  const frozen = q.has('pose');
  if (frozen) {
    const set = {};
    for (const kv of (q.get('set') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); set[k] = +v; }
    if (q.has('notilt')) dbg.flags.tilt = false;
    dbg.poseAt(+q.get('pose'), set); pitch.rotation.x = dbg.lidPitch; setRoll(dbg.lidRoll);
  }

  let started = false, owed = 0;
  const lickOpts = { speed: +(q.get('speed') ?? 1), mirror: q.has('mirror'), lid: (p) => { pitch.rotation.x = p; }, ...(q.has('notilt') ? {} : { roll: setRoll }) };
  function tick(dt) {
    clock += dt;
    if (frozen) return;
    if (shot && !started && clock >= lickAt) { started = true; tongue.lick(lickOpts); }
    tongue.update(dt);
  }

  // a vertex as drawn: squashed as the shader squashes it (in the rest pose), then skinned
  const skinned = (i, v) => (dbg.restVertex ? tmesh.applyBoneTransform(i, dbg.restVertex(i, v)) : tmesh.getVertexPosition(i, v));

  // Where does the tongue go through the bin or the lid? Its vertices as drawn (squashed as the shader squashes them,
  // skinned on the CPU, plus the shader's clamp in the gap) against the bin's solid parts and the lid, object3d space.
  // raw: the same before the shader's clamp.
  const OX = 0.439, OZ = 0.395, UX = 0.554, UZ = 0.5, FLOOR = -0.78;
  function check() {
    if (!tmesh || !tmesh.visible) return { visible: false };
    tongue.object3d.updateMatrixWorld(true); tmesh.skeleton.update();
    const p = tmesh.geometry.attributes.position, v = new THREE.Vector3();
    const inv = new THREE.Matrix4().copy(tongue.object3d.matrixWorld).invert();
    const s = Math.sin(-pitch.rotation.x), c = Math.cos(-pitch.rotation.x), ze = -0.5 + c, tn = s / c;
    lidMesh.updateWorldMatrix(true, false);
    const toLidM = new THREE.Matrix4().copy(lidMesh.matrixWorld).invert().multiply(tongue.object3d.matrixWorld), lv = new THREE.Vector3();
    const rr = rollG.rotation.z, rx = rollG.position.x, rslope = Math.tan(rr) / c;
    const edge = tmesh.material.userData.uEdge ?? { value: { x: 0.51, y: 0.93 } };
    const out = { rim: 0, wall: 0, lid: 0, edge: 0, under: 0, base: 0, below: 0, raw: 0, maxY: -9, minY: 9, maxZ: -9, maxX: 0, n: p.count, at: {} };
    const solid = (v) => {
      const ax = Math.abs(v.x), az = Math.abs(v.z);
      const y = v.y;
      lv.copy(v).applyMatrix4(toLidM); // lid space (its mesh's own: x across, y up from its underside, z from the hinge)
      const xl = lv.x, yl = lv.y, zl = lv.z;
      // (how far in from the lid's outline: its sides, front and back, its cut corners)
      const din = -Math.max(Math.abs(xl) - 0.51, Math.abs(zl - 0.47) - 0.53, (Math.abs(xl) + Math.abs(zl - 0.47) - 0.96) * Math.SQRT1_2);
      // (edge: in the lid's edge, wherever the tongue comes out under it, where the clamp fades out; under: pressing up
      // into its underside a little, well in from the edge: in the dark, unseen; lid: into it anywhere else)
      if (din > 0.01 && yl > 0.004 && (yl < 0.1 || (yl < 0.172 && Math.abs(xl) < 0.34 && zl > 0.19 && zl < 0.77))) return din < 0.035 ? 'edge' : yl < 0.035 && din > 0.08 ? 'under' : 'lid';
      if (y < -0.004 && y > -0.084 && ax < UX - 0.004 && az < UZ - 0.004 && !(ax < OX && az < OZ) && ax + az < 0.97) return 'rim';
      const f = Math.min(1, Math.max(0, (y + 0.564) / 0.48)), bx = 0.428 + 0.046 * f - 0.006, bz = 0.39 + 0.04 * f - 0.006;
      if (y <= -0.084 && y > -0.564 && ax < bx && az < bz && !(ax < OX + 0.008 && az < OZ + 0.008) && ax + az < 0.755 + 0.079 * f) return 'wall'; // (into the wall, not grazing its inside)
      if (y <= -0.56 && y > -0.756 && ax < 0.466 && v.z < 0.394 && v.z > -0.354) return 'base';
      if (y < FLOOR) return 'below';
      return null;
    };
    for (let i = 0; i < p.count; i++) {
      skinned(i, v); v.applyMatrix4(tmesh.matrixWorld).applyMatrix4(inv);
      if (solid(v)) out.raw++;
      { // the shader's clamp (as in tongue-model.js: under the lid, in from its outline as it is now; on the rim)
        const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
        const ax = Math.abs(v.x), az = Math.abs(v.z), ed = edge.value;
        const dIn = -Math.max(ax - ed.x, v.z - ze, (ax + v.z - ed.y) * Math.SQRT1_2);
        const fade = ss(-0.006, 0.012, dIn);
        if (fade > 0) {
          const yTop = (v.z + 0.5) * tn + (v.x - rx) * rslope - 0.004, o = v.y - yTop;
          if (o > 0) v.y -= fade * (o < 0.04 ? o : Math.max(0, 0.04 - (o - 0.04)));
        }
        const rimSd = Math.max(ax - UX, az - UZ, (ax + az - 0.974) * Math.SQRT1_2);
        const fb = ss(0.015, -0.01, rimSd) * ss(-0.012, 0.002, Math.max(ax - OX, az - OZ));
        if (fb > 0) { const u = 0.004 - v.y; if (u > 0) v.y += fb * (u < 0.05 ? u : Math.max(0, 0.05 - (u - 0.05))); }
      }
      const hit = solid(v);
      if (hit) { out[hit]++; if ((out.at[hit] ??= []).length < 4) out.at[hit].push([+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)]); }
      if (v.z > ze) { out.maxY = Math.max(out.maxY, v.y); out.minY = Math.min(out.minY, v.y); out.maxZ = Math.max(out.maxZ, v.z); out.maxX = Math.max(out.maxX, Math.abs(v.x)); }
    }
    return out;
  }

  // How close does the tongue lie to what it licks? Every skinned vertex out of the gap against the module's own
  // distance fields of the bin and the lid, grouped by the face it is nearest (lid top / lid front / rim top / front /
  // left / right / base): how many are within 0.015 and 0.03 of it, and the nearest.
  function contact() {
    if (!tmesh || !tmesh.visible) return { visible: false };
    tongue.object3d.updateMatrixWorld(true); tmesh.skeleton.update();
    const p = tmesh.geometry.attributes.position, v = new THREE.Vector3();
    const inv = new THREE.Matrix4().copy(tongue.object3d.matrixWorld).invert();
    const ze = -0.5 + Math.cos(-pitch.rotation.x), out = {};
    for (let i = 0; i < p.count; i += 2) {
      skinned(i, v); v.applyMatrix4(tmesh.matrixWorld).applyMatrix4(inv);
      if (v.z < ze + 0.02 && v.y < 0.12 && v.y > -0.1 && Math.abs(v.x) < 0.53) continue; // (in the gap, wherever on the track)
      if (v.y < 0.02 && Math.abs(v.x) < OX + 0.02 && Math.abs(v.z) < OZ + 0.02) continue; // (down in the bin: hidden)
      const s = dbg.sdf(v.x, v.y, v.z);
      let d, face;
      if (s.lid < s.bin) { d = s.lid; face = s.nl[1] > 0.7 ? 'lidTop' : s.nl[2] > 0.7 ? 'lidFront' : s.nl[0] < -0.7 ? 'lidLeft' : s.nl[0] > 0.7 ? 'lidRight' : 'lidEdge'; }
      else { d = s.bin; const n = s.nb; face = n[1] > 0.7 ? (v.y < -0.5 ? 'floor' : 'rimTop') : n[2] > 0.7 ? (v.y < -0.554 ? 'base' : 'front') : n[0] < -0.7 ? 'left' : n[0] > 0.7 ? 'right' : 'edge'; }
      if (v.y < -0.75) { d = Math.min(d, v.y + 0.78); }
      const o = (out[face] ??= { n: 0, c15: 0, c30: 0, min: 9 });
      o.n++; if (d < 0.015) o.c15++; if (d < 0.03) o.c30++; o.min = Math.min(o.min, +d.toFixed(3));
    }
    return out;
  }

  window.__stage = {
    tongue, cues, check, contact, pitch, setRoll,
    get clock() { return clock; },
    // whole 60 Hz frames; what is left over is kept for the next call (so steps that aren't a multiple of 1/60 add up)
    advance(s) { owed += s; const n = Math.floor(owed * 60 + 1e-6); owed -= n / 60; for (let i = 0; i < n; i++) tick(1 / 60); render(); },
    // a contact sheet: one cell per moment (scene times, ascending), returned as a PNG data URL
    sheet(times, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(times.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      times.forEach((t, k) => {
        this.advance(t - clock);
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`t=${(t - lickAt).toFixed(2)}  lid ${(-pitch.rotation.x).toFixed(3)} roll ${rollG.rotation.z.toFixed(3)}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      return out.toDataURL('image/png');
    },
    // look-dev: still poses (settled, no drips), one cell each: [{ t, set: { bend: -1, out: 0.5, ... }, label }]
    poseSheet(list, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(list.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      list.forEach((p, k) => {
        dbg.poseAt(p.t ?? 0, p.set || {}); pitch.rotation.x = dbg.lidPitch; setRoll(dbg.lidRoll);
        render();
        const c = check();
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`${p.label ?? `t=${p.t}`}  rim ${c.rim} wall ${c.wall} lid ${c.lid} base ${c.base}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      dbg.mesh.visible = false; pitch.rotation.x = 0; setRoll(0);
      return out.toDataURL('image/png');
    },
  };
  window.__ready = true;
  if (!shot) {
    let last = performance.now(), next = 0.8, mirror = false;
    const go = () => { if (!tongue.busy) { tongue.lick({ ...lickOpts, mirror }); mirror = false; } };
    canvas.addEventListener('pointerdown', go);
    addEventListener('keydown', (e) => { if (e.key === ' ') go(); if (e.key === 'm') mirror = true; });
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      tick(dt);
      if (!frozen && clock >= next) { next = clock + 4; go(); }
      render();
      hud.textContent = `t=${clock.toFixed(2)} ${tongue.busy ? 'licking' : ''}  lid ${(-pitch.rotation.x).toFixed(3)} roll ${rollG.rotation.z.toFixed(3)}`;
    })(last);
  } else render();
</script>
</body>
</html>
