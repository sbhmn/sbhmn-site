<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBHMN lab: tongue model</title>
<link rel="icon" href="data:,">
<!-- Test bench for assets/intro/tongue-model.js (the owner's tongue model, rigged; not linked from the site): the
     intro's bin (lid open, as during the throw) with the tongue, seen from the throw camera and the front camera.
     /dev/lab-tongue-model.html            live: licks every 3.4 s; click or space to lick now, M mirrors the next one
     ?view=both | throw | front | side | close | low | tclose | fclose | cam | throw,side,...   which camera(s)
                                          (default both = throw,front, side by side; side = from the right, close =
                                          nearer, for the look of the material, low = low and near, in front; tclose /
                                          fclose = the throw / front camera zoomed in on the opening; cam = your own:
                                          &cam=x,y,z,targetX,targetY,targetZ,fov in bin space)
     &which=procedural                    the procedural tongue (assets/intro/tongue.js) instead, to compare
     &shot                                no loop: dev/tongue-model-shot.cjs steps it with __stage.advance(s); the lick
                                          starts at scene time &at (default 0.1)
     &speed=1  &mirror                    lick options
     &bones                               draw the chain (joints, and each one's top as a tick)
     &pose=0.5                            freeze the tongue in the lick's pose at that time (no drips), for look-dev
     &set=drape:-1,root:0;-0.4;0.1         ... with some of the pose's numbers overridden
     &tm=clearcoat:0,roughness:0.5        override tongue material numbers
     &fxscene                             the drips live in the scene (opts.fxParent = scene)
     &glb=/path/to.glb                    another build of the model
     &cold                                no warm() before the first lick
     &nocollide                           the raw chain (keyframes + springs), not kept out of the bin
     &map | &uvgrid                       the colour map unlit | a labelled UV grid on the tongue
     __stage.advance(s), .sheet(times), .poseSheet([{ t, set, label }]), .check()   for the scripts -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 monospace; color: #888; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas></canvas>
<div class="hud"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '/assets/vendor/three/addons/loaders/GLTFLoader.js';
  const q = new URLSearchParams(location.search);
  const which = q.get('which') === 'procedural' ? 'procedural' : 'model';
  const { createTongue } = await import(which === 'model' ? '/assets/intro/tongue-model.js' : '/assets/intro/tongue.js');
  const mode = q.get('view') ?? 'both';
  const views = mode === 'both' ? ['throw', 'front'] : mode.split(',');
  const shot = q.has('shot'), lickAt = +(q.get('at') ?? 0.1);
  const canvas = document.querySelector('canvas');
  const hud = document.querySelector('.hud');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: shot });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(-2.2, 5, 3.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 12 });
  sun.shadow.radius = 4;
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.13 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // the bin, as intro.js builds it, lid open (the throw)
  const gltf = await new GLTFLoader().loadAsync('/assets/3d/bin.glb');
  const binMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.75, metalness: 0, flatShading: true });
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
  const bin = new THREE.Group();
  scene.add(bin);
  const parts = {};
  gltf.scene.traverse((o) => { if (o.isMesh) parts[o.name] = o; });
  for (const name of ['body', 'rim', 'base', 'wheels', 'inside']) {
    const m = parts[name]; if (!m) continue;
    m.material = name === 'inside' ? voidMat : binMat;
    m.castShadow = name !== 'inside'; m.receiveShadow = true;
    bin.add(m);
  }
  const lidMesh = parts.lid;
  const pitch = new THREE.Group(); pitch.position.copy(lidMesh.position); bin.add(pitch);
  lidMesh.position.set(0, 0, 0); lidMesh.material = binMat; lidMesh.castShadow = true; pitch.add(lidMesh);
  const lining = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.98), new THREE.MeshBasicMaterial({ color: 0, side: THREE.DoubleSide }));
  lining.rotation.x = Math.PI / 2; lining.position.set(0, -0.002, 0.5); lidMesh.add(lining);
  pitch.rotation.x = -1.9;

  // the tongue
  const cues = [];
  let clock = 0;
  const tongue = await createTongue(THREE, { ...(q.get('glb') ? { url: q.get('glb') } : {}), rimY: 0.78, fxParent: q.has('fxscene') ? scene : null, onCue: (name) => { if (name !== 'splat') cues.push(`${(clock - lickAt).toFixed(2)} ${name}`); } });
  bin.add(tongue.object3d);
  tongue.object3d.position.set(0, 0.78, 0);
  if (tongue.ready) await tongue.ready;
  const tmesh = tongue.debug?.mesh;
  if (q.has('nocollide') && tongue.debug?.flags) tongue.debug.flags.collide = false; // the raw chain, not kept out of the bin
  if (q.get('tm') && tmesh) {
    const m = tmesh.material;
    for (const kv of q.get('tm').split(',')) {
      const [k, v] = kv.split(':');
      if (k === 'tint') m.color.set(+v);
      else if (m[k]?.isVector2) m[k].set(+v, +v);
      else m[k] = +v;
    }
    m.needsUpdate = true;
  }

  // &uvgrid: the tongue in a labelled UV grid (which part of the colour map is where); &map: the colour map, unlit
  if ((q.has('uvgrid') || q.has('map')) && tmesh) {
    let tex = tmesh.material.map;
    if (q.has('uvgrid')) {
      const c = document.createElement('canvas'); c.width = c.height = 1024;
      const x = c.getContext('2d');
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
        x.fillStyle = `hsl(${(i * 8 + j) * 47 % 360}, 70%, ${45 + (i + j) % 2 * 20}%)`; x.fillRect(i * 128, j * 128, 128, 128);
        x.fillStyle = '#000'; x.font = 'bold 44px monospace'; x.fillText(`${i}${j}`, i * 128 + 30, j * 128 + 80);
      }
      tex = new THREE.CanvasTexture(c); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
    }
    tmesh.material = new THREE.MeshBasicMaterial({ map: tex });
  }

  // the chain, drawn
  const dbg = tongue.debug;
  let chainLine = null;
  if (q.has('bones') && dbg) {
    const n = (dbg.NJ + 1) * 2 + dbg.NJ * 2;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    chainLine = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x00a0ff, depthTest: false }));
    chainLine.renderOrder = 10; chainLine.frustumCulled = false;
    tongue.object3d.add(chainLine);
  }
  function drawChain() {
    if (!chainLine) return;
    const a = chainLine.geometry.attributes.position.array; let i = 0;
    const put = (v) => { a[i++] = v.x; a[i++] = v.y; a[i++] = v.z; };
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); put(dbg.pos[k + 1]); }
    const z = new THREE.Vector3();
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); z.set(0, 0, 0.08).applyQuaternion(dbg.rot[k]).add(dbg.pos[k]); put(z); }
    chainLine.geometry.attributes.position.needsUpdate = true;
  }

  // cameras (intro.js's view.throw / view.front)
  const MARK = { left: -0.62, right: 0.6213, top: 1.076, bottom: -0.0773 };
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  function place(name, aspect) {
    camera.aspect = aspect;
    if (name === 'throw') {
      const fov = 40, base = 3.9;
      const fit = 1.9 / (2 * base * Math.tan(THREE.MathUtils.degToRad(fov / 2)) * aspect);
      const d = base * Math.max(1, fit);
      camera.position.set(0, 0.5, 0).addScaledVector(new THREE.Vector3(0, 1.25, 3.7).normalize(), d);
      camera.fov = fov; camera.lookAt(0, 0.5, 0);
    } else if (name === 'side') {
      camera.fov = 30; camera.position.set(4.2, 1.2, 0.4); camera.lookAt(0, 0.9, 0.2);
    } else if (name === 'close') {
      camera.fov = 26; camera.position.set(0.7, 1.75, 2.6); camera.lookAt(0, 1.05, 0.25);
    } else if (name === 'cam') { // &cam=x,y,z,tx,ty,tz,fov (bin space)
      const c = (q.get('cam') || '2,1.2,2,0,0.8,0,20').split(',').map(Number);
      camera.position.set(c[0], c[1], c[2]); camera.fov = c[6]; camera.lookAt(c[3], c[4], c[5]);
    } else if (name === 'tclose') { // the throw camera's view of the opening, zoomed in
      camera.position.set(0, 0.5, 0).addScaledVector(new THREE.Vector3(0, 1.25, 3.7).normalize(), 3.9);
      camera.fov = 17; camera.lookAt(0, 0.82, 0.3);
    } else if (name === 'fclose') { // the front camera's view of the opening, zoomed in
      camera.position.set(0, 0.6, 8); camera.fov = 9; camera.lookAt(0, 0.75, 0);
    } else if (name === 'low') {
      camera.fov = 30; camera.position.set(0.5, 0.6, 2.3); camera.lookAt(0, 0.55, 0.5);
    } else {
      const fov = 18, t = 2 * Math.tan(THREE.MathUtils.degToRad(fov / 2));
      const h = MARK.top - MARK.bottom, w = MARK.right - MARK.left;
      const d = Math.max(h / 0.5 / t, w / 0.62 / (t * aspect));
      const cy = (MARK.top + MARK.bottom) / 2;
      camera.position.set(0, cy, d); camera.fov = fov; camera.lookAt(0, cy, 0);
    }
    camera.updateProjectionMatrix();
  }
  function render() {
    drawChain();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const n = views.length, cw = Math.floor(w / n);
    renderer.setScissorTest(n > 1);
    views.forEach((v, k) => {
      renderer.setViewport(k * cw, 0, cw, h); renderer.setScissor(k * cw, 0, cw, h);
      place(v, cw / h);
      renderer.render(scene, camera);
    });
  }
  function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
  window.addEventListener('resize', resize); resize();
  if (!q.has('cold')) { place(views[0], 1); tongue.warm?.(renderer, camera); } // &cold: no warm() (to time the first lick)

  const frozen = q.has('pose') && dbg;
  if (frozen) {
    // &set=drape:-1,arch:0.2,root:0;-0.4;0.1 : override the pose's parameters
    const set = {};
    for (const kv of (q.get('set') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); set[k] = k === 'root' ? v.split(';').map(Number) : +v; }
    dbg.poseAt(+q.get('pose'), set); dbg.mesh.visible = true;
  }

  let started = false, owed = 0;
  const lickOpts = { speed: +(q.get('speed') ?? 1), mirror: q.has('mirror') };
  function tick(dt) {
    clock += dt;
    if (frozen) return;
    if (shot && !started && clock >= lickAt) { started = true; tongue.lick(lickOpts); }
    tongue.update(dt);
  }

  // Where does the tongue go through the bin? Skinned vertices (CPU) against the bin's solid parts, object3d space.
  const OX = 0.439, OZ = 0.395, UX = 0.554, UZ = 0.5, FLOOR = -0.78;
  function check() {
    if (!tmesh || !tmesh.visible) return { visible: false };
    tongue.object3d.updateMatrixWorld(true); tmesh.skeleton.update();
    const p = tmesh.geometry.attributes.position, v = new THREE.Vector3();
    const inv = new THREE.Matrix4().copy(tongue.object3d.matrixWorld).invert();
    const out = { rim: 0, wall: 0, below: 0, behind: 0, maxY: -9, n: p.count };
    for (let i = 0; i < p.count; i++) {
      tmesh.getVertexPosition(i, v); v.applyMatrix4(tmesh.matrixWorld).applyMatrix4(inv);
      const ax = Math.abs(v.x), az = Math.abs(v.z);
      out.maxY = Math.max(out.maxY, v.y);
      if (v.y < FLOOR) out.below++;
      if (v.z < -UZ - 0.02 && v.y > 0) out.behind++;
      if (v.y < -0.005 && v.y > -0.084 && ax < UX && az < UZ && !(ax < OX && az < OZ)) out.rim++;          // in the rim
      else if (v.y <= -0.084 && ax < 0.474 && az < 0.43 && !(ax < OX - 0.005 && az < OZ - 0.005)) out.wall++; // in a wall
    }
    return out;
  }

  window.__stage = {
    tongue, cues, check,
    get clock() { return clock; },
    // whole 60 Hz frames; what is left over is kept for the next call (so steps that aren't a multiple of 1/60 add up)
    advance(s) { owed += s; const n = Math.floor(owed * 60 + 1e-6); owed -= n / 60; for (let i = 0; i < n; i++) tick(1 / 60); render(); },
    // a contact sheet: one cell per moment (scene times, ascending), returned as a PNG data URL
    sheet(times, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(times.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      times.forEach((t, k) => {
        this.advance(t - clock);
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`t=${(t - lickAt).toFixed(2)}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      return out.toDataURL('image/png');
    },
    // look-dev: still poses (settled, no drips), one cell each: [{ t, set: { drape: -1, root: [0, -0.4, 0.1], ... }, label }]
    poseSheet(list, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(list.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      list.forEach((p, k) => {
        dbg.poseAt(p.t ?? 0, p.set || {}); dbg.mesh.visible = true;
        render();
        const c = check();
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`${p.label ?? `t=${p.t}`}  maxY ${c.maxY.toFixed(2)} rim ${c.rim} wall ${c.wall}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      dbg.mesh.visible = false;
      return out.toDataURL('image/png');
    },
  };
  window.__ready = true;
  if (!shot) {
    let last = performance.now(), next = 0.6, mirror = false;
    const go = () => { if (!tongue.busy) { tongue.lick({ ...lickOpts, mirror }); mirror = false; } };
    canvas.addEventListener('pointerdown', go);
    addEventListener('keydown', (e) => { if (e.key === ' ') go(); if (e.key === 'm') mirror = true; });
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      tick(dt);
      if (!frozen && clock >= next) { next = clock + 3.4; go(); }
      render();
      hud.textContent = `${which}  t=${clock.toFixed(2)} ${tongue.busy ? 'licking' : ''}`;
    })(last);
  } else render();
</script>
</body>
</html>
