<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBHMN lab: tongue model</title>
<link rel="icon" href="data:,">
<!-- Test bench for assets/intro/tongue-model.js (the owner's tongue model, rigged; not linked from the site): the
     intro's bin with the lid SHUT (as after the slam, the black monster block under it), the tongue squeezing out
     through the gap under the lid's front edge, the lid riding on it (the module's lid(pitch) drives the lid here).
     /dev/lab-tongue-model.html            live: licks every 4.2 s; click or space to lick now, M mirrors the next one
     ?view=throw,phone,front (default) | throw | phone | front | side | close | low | tclose | fclose | pclose | cam
                                          | any list: which camera(s), side by side. throw = the throw camera
                                          (landscape), phone = the throw camera on a portrait phone (aspect 0.46: it
                                          backs off so the bin fits), front = the intro's front camera (reference), side
                                          = from the right, close = nearer, low = low and near, tclose / fclose / pclose
                                          = the throw / front / phone camera zoomed in on the gap; cam = your own:
                                          &cam=x,y,z,targetX,targetY,targetZ,fov in bin space
     &shot                                no loop: dev/tongue-model-shot.cjs steps it with __stage.advance(s); the lick
                                          starts at scene time &at (default 0.1)
     &speed=1  &mirror                    lick options
     &bones                               draw the chain (joints, and each one's top as a tick)
     &pose=0.5                            freeze the tongue in the lick's pose at that time (no drips, the lid at the
                                          push), for look-dev
     &set=bend:-1,out:0.5                 ... with some of the pose's numbers overridden
     &tm=clearcoat:0,roughness:0.5        override tongue material numbers
     &fxscene                             the drips live in the scene (opts.fxParent = scene)
     &glb=/path/to.glb                    another build of the model
     &cold                                no warm() before the first lick
     &nocollide                           the raw chain (keyframes + springs), not kept off the bin and the lid
     &nomonster                           no black block under the lid
     &map | &uvgrid                       the colour map unlit | a labelled UV grid on the tongue
     __stage.advance(s), .sheet(times), .poseSheet([{ t, set, label }]), .check()   for the scripts -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 monospace; color: #888; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas></canvas>
<div class="hud"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '/assets/vendor/three/addons/loaders/GLTFLoader.js';
  import { createTongue } from '/assets/intro/tongue-model.js';
  const q = new URLSearchParams(location.search);
  const views = (q.get('view') ?? 'throw,phone,front').split(',');
  const shot = q.has('shot'), lickAt = +(q.get('at') ?? 0.1);
  const canvas = document.querySelector('canvas');
  const hud = document.querySelector('.hud');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: shot });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(-2.2, 5, 3.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 12 });
  sun.shadow.radius = 4;
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.13 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // the bin, as intro.js builds it: the lid on a pitch group at its hinge, shut; the black monster block under it
  const gltf = await new GLTFLoader().loadAsync('/assets/3d/bin.glb');
  const binMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.75, metalness: 0, flatShading: true });
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
  const pitchBlack = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
  const bin = new THREE.Group();
  scene.add(bin);
  const parts = {};
  gltf.scene.traverse((o) => { if (o.isMesh) parts[o.name] = o; });
  for (const name of ['body', 'rim', 'base', 'wheels', 'inside']) {
    const m = parts[name]; if (!m) continue;
    m.material = name === 'inside' ? voidMat : binMat;
    m.castShadow = name !== 'inside'; m.receiveShadow = true;
    bin.add(m);
  }
  const lidMesh = parts.lid;
  const pitch = new THREE.Group(); pitch.position.copy(lidMesh.position); bin.add(pitch);
  lidMesh.position.set(0, 0, 0); lidMesh.material = binMat; lidMesh.castShadow = true; lidMesh.receiveShadow = true; pitch.add(lidMesh);
  const lining = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.98), pitchBlack);
  lining.rotation.x = Math.PI / 2; lining.position.set(0, -0.002, 0.5); lidMesh.add(lining);
  pitch.rotation.x = 0;
  if (!q.has('nomonster')) {
    const block = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.5, 0.74), pitchBlack);
    block.position.set(0, 0.775 - 0.25, 0);
    bin.add(block);
  }

  // the tongue
  const cues = [];
  let clock = 0;
  const tongue = createTongue(THREE, { ...(q.get('glb') ? { url: q.get('glb') } : {}), rimY: 0.78, fxParent: q.has('fxscene') ? scene : null, onCue: (name, info) => { if (name !== 'splat') cues.push(`${(clock - lickAt).toFixed(2)} ${name}${info?.strength != null ? ' ' + info.strength.toFixed(2) : ''}`); } });
  bin.add(tongue.object3d);
  tongue.object3d.position.set(0, 0.78, 0);
  await tongue.ready;
  const dbg = tongue.debug, tmesh = dbg.mesh;
  if (q.has('nocollide')) dbg.flags.collide = false;
  if (q.get('tm') && tmesh) {
    const m = tmesh.material;
    for (const kv of q.get('tm').split(',')) {
      const [k, v] = kv.split(':');
      if (k === 'tint') m.color.set(+v);
      else if (m[k]?.isVector2) m[k].set(+v, +v);
      else m[k] = +v;
    }
    m.needsUpdate = true;
  }

  // &uvgrid: the tongue in a labelled UV grid (which part of the colour map is where); &map: the colour map, unlit
  if ((q.has('uvgrid') || q.has('map')) && tmesh) {
    let tex = tmesh.material.map;
    if (q.has('uvgrid')) {
      const c = document.createElement('canvas'); c.width = c.height = 1024;
      const x = c.getContext('2d');
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
        x.fillStyle = `hsl(${(i * 8 + j) * 47 % 360}, 70%, ${45 + (i + j) % 2 * 20}%)`; x.fillRect(i * 128, j * 128, 128, 128);
        x.fillStyle = '#000'; x.font = 'bold 44px monospace'; x.fillText(`${i}${j}`, i * 128 + 30, j * 128 + 80);
      }
      tex = new THREE.CanvasTexture(c); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
    }
    tmesh.material = new THREE.MeshBasicMaterial({ map: tex });
  }

  // the chain, drawn
  let chainLine = null;
  if (q.has('bones')) {
    const n = (dbg.NJ + 1) * 2 + dbg.NJ * 2;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    chainLine = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x00a0ff, depthTest: false }));
    chainLine.renderOrder = 10; chainLine.frustumCulled = false;
    tongue.object3d.add(chainLine);
  }
  function drawChain() {
    if (!chainLine) return;
    const a = chainLine.geometry.attributes.position.array; let i = 0;
    const put = (v) => { a[i++] = v.x; a[i++] = v.y; a[i++] = v.z; };
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); put(dbg.pos[k + 1]); }
    const z = new THREE.Vector3();
    for (let k = 0; k < dbg.NJ; k++) { put(dbg.pos[k]); z.set(0, 0, 0.08).applyQuaternion(dbg.rot[k]).add(dbg.pos[k]); put(z); }
    chainLine.geometry.attributes.position.needsUpdate = true;
  }

  // cameras (intro.js's view.throw / view.front); phone: the throw camera at a portrait phone's aspect
  const MARK = { left: -0.62, right: 0.6213, top: 1.076, bottom: -0.0773 };
  const PHONE = 0.46;
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  const throwAt = (aspect) => {
    const fov = 40, base = 3.9;
    const fit = 1.9 / (2 * base * Math.tan(THREE.MathUtils.degToRad(fov / 2)) * aspect);
    return base * Math.max(1, fit);
  };
  const dir = new THREE.Vector3(0, 1.25, 3.7).normalize();
  function place(name, aspect) {
    camera.aspect = aspect;
    if (name === 'throw' || name === 'phone') {
      camera.position.set(0, 0.5, 0).addScaledVector(dir, throwAt(aspect));
      camera.fov = 40; camera.lookAt(0, 0.5, 0);
    } else if (name === 'side') {
      camera.fov = 30; camera.position.set(4.2, 1.2, 0.4); camera.lookAt(0, 0.7, 0.4);
    } else if (name === 'close') {
      camera.fov = 26; camera.position.set(0.9, 1.5, 2.8); camera.lookAt(0, 0.75, 0.45);
    } else if (name === 'cam') { // &cam=x,y,z,tx,ty,tz,fov (bin space)
      const c = (q.get('cam') || '2,1.2,2,0,0.8,0,20').split(',').map(Number);
      camera.position.set(c[0], c[1], c[2]); camera.fov = c[6]; camera.lookAt(c[3], c[4], c[5]);
    } else if (name === 'tclose' || name === 'pclose') { // the throw / phone camera's view of the gap, zoomed in
      camera.position.set(0, 0.5, 0).addScaledVector(dir, throwAt(name === 'pclose' ? PHONE : 1.7));
      camera.fov = name === 'pclose' ? 24 : 24; camera.lookAt(0, 0.68, 0.45);
    } else if (name === 'fclose') { // the front camera's view of the gap, zoomed in
      camera.position.set(0, 0.6, 8); camera.fov = 9; camera.lookAt(0, 0.7, 0);
    } else if (name === 'low') {
      camera.fov = 30; camera.position.set(0.5, 0.6, 2.3); camera.lookAt(0, 0.55, 0.5);
    } else {
      const fov = 18, t = 2 * Math.tan(THREE.MathUtils.degToRad(fov / 2));
      const h = MARK.top - MARK.bottom, w = MARK.right - MARK.left;
      const d = Math.max(h / 0.5 / t, w / 0.62 / (t * aspect));
      const cy = (MARK.top + MARK.bottom) / 2;
      camera.position.set(0, cy, d); camera.fov = fov; camera.lookAt(0, cy, 0);
    }
    camera.updateProjectionMatrix();
  }
  // each view its own width: phone views are portrait (aspect 0.46), the rest share what is left
  function layout(w, h) {
    const nPhone = views.filter((v) => v === 'phone' || v === 'pclose').length;
    const pw = Math.round(h * PHONE), rest = views.length - nPhone;
    const ow = rest ? Math.floor((w - nPhone * pw) / rest) : 0;
    let x = 0;
    return views.map((v) => { const vw = v === 'phone' || v === 'pclose' ? pw : ow; const r = { v, x, w: vw }; x += vw; return r; });
  }
  function render() {
    drawChain();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cells = layout(w, h);
    renderer.setScissorTest(cells.length > 1);
    renderer.setClearColor(0xffffff);
    for (const c of cells) {
      renderer.setViewport(c.x, 0, c.w, h); renderer.setScissor(c.x, 0, c.w, h);
      place(c.v, c.w / h);
      renderer.render(scene, camera);
    }
  }
  function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
  window.addEventListener('resize', resize); resize();
  if (!q.has('cold')) { place(views[0], 1); tongue.warm(renderer, camera); } // &cold: no warm() (to time the first lick)

  const frozen = q.has('pose');
  if (frozen) {
    const set = {};
    for (const kv of (q.get('set') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); set[k] = +v; }
    dbg.poseAt(+q.get('pose'), set); pitch.rotation.x = dbg.lidPitch;
  }

  let started = false, owed = 0;
  const lickOpts = { speed: +(q.get('speed') ?? 1), mirror: q.has('mirror'), lid: (p) => { pitch.rotation.x = p; } };
  function tick(dt) {
    clock += dt;
    if (frozen) return;
    if (shot && !started && clock >= lickAt) { started = true; tongue.lick(lickOpts); }
    tongue.update(dt);
  }

  // Where does the tongue go through the bin or the lid? Skinned vertices (CPU, plus the shader's clamp in the gap)
  // against the bin's solid parts and the lid, object3d space. raw: the same before the shader's clamp.
  const OX = 0.439, OZ = 0.395, UX = 0.554, UZ = 0.5, FLOOR = -0.78;
  function check() {
    if (!tmesh || !tmesh.visible) return { visible: false };
    tongue.object3d.updateMatrixWorld(true); tmesh.skeleton.update();
    const p = tmesh.geometry.attributes.position, v = new THREE.Vector3();
    const inv = new THREE.Matrix4().copy(tongue.object3d.matrixWorld).invert();
    const s = Math.sin(-pitch.rotation.x), c = Math.cos(-pitch.rotation.x), ze = -0.5 + c, tn = s / c;
    const out = { rim: 0, wall: 0, lid: 0, edge: 0, below: 0, raw: 0, maxY: -9, minY: 9, maxZ: -9, maxX: 0, n: p.count, at: {} };
    const solid = (v) => {
      const ax = Math.abs(v.x), az = Math.abs(v.z);
      const y = v.y, zz = v.z + 0.5, yl = y * c - zz * s, zl = y * s + zz * c;
      if (Math.abs(v.x) < 0.5 && zl > -0.05 && zl < 0.99 && yl > 0.004 && yl < 0.1) return zl > 0.975 ? 'edge' : 'lid'; // (edge: in the lid's front edge, where the clamp fades out)
      if (y < -0.004 && y > -0.084 && ax < UX - 0.004 && az < UZ - 0.004 && !(ax < OX && az < OZ) && ax + az < 0.97) return 'rim';
      if (y <= -0.084 && ax < 0.468 && az < 0.424 && !(ax < OX + 0.008 && az < OZ + 0.008) && ax + az < 0.83) return 'wall'; // (into the wall, not grazing its inside)
      if (y < FLOOR) return 'below';
      return null;
    };
    for (let i = 0; i < p.count; i++) {
      tmesh.getVertexPosition(i, v); v.applyMatrix4(tmesh.matrixWorld).applyMatrix4(inv);
      if (solid(v)) out.raw++;
      { // the shader's clamp (as in tongue-model.js)
        const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
        const zr = v.z - ze, ax = Math.abs(v.x);
        const fade = (1 - ss(0.5, 0.56, ax)) * ss(0, -0.025, zr);
        if (fade > 0) {
          const yTop = (v.z + 0.5) * tn - 0.004, o = v.y - yTop;
          if (o > 0) v.y -= fade * (o < 0.04 ? o : Math.max(0, 0.04 - (o - 0.04)));
        }
        const fb = (1 - ss(0.54, 0.58, ax)) * ss(0.515, 0.49, v.z) * ss(OZ - 0.012, OZ + 0.002, v.z);
        if (fb > 0) { const u = 0.004 - v.y; if (u > 0) v.y += fb * (u < 0.04 ? u : Math.max(0, 0.04 - (u - 0.04))); }
      }
      const hit = solid(v);
      if (hit) { out[hit]++; if ((out.at[hit] ??= []).length < 4) out.at[hit].push([+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)]); }
      if (v.z > ze) { out.maxY = Math.max(out.maxY, v.y); out.minY = Math.min(out.minY, v.y); out.maxZ = Math.max(out.maxZ, v.z); out.maxX = Math.max(out.maxX, Math.abs(v.x)); }
    }
    return out;
  }

  window.__stage = {
    tongue, cues, check, pitch,
    get clock() { return clock; },
    // whole 60 Hz frames; what is left over is kept for the next call (so steps that aren't a multiple of 1/60 add up)
    advance(s) { owed += s; const n = Math.floor(owed * 60 + 1e-6); owed -= n / 60; for (let i = 0; i < n; i++) tick(1 / 60); render(); },
    // a contact sheet: one cell per moment (scene times, ascending), returned as a PNG data URL
    sheet(times, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(times.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      times.forEach((t, k) => {
        this.advance(t - clock);
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`t=${(t - lickAt).toFixed(2)}  lid ${(-pitch.rotation.x).toFixed(3)}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      return out.toDataURL('image/png');
    },
    // look-dev: still poses (settled, no drips), one cell each: [{ t, set: { bend: -1, out: 0.5, ... }, label }]
    poseSheet(list, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(list.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      list.forEach((p, k) => {
        dbg.poseAt(p.t ?? 0, p.set || {}); pitch.rotation.x = dbg.lidPitch;
        render();
        const c = check();
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`${p.label ?? `t=${p.t}`}  rim ${c.rim} wall ${c.wall} lid ${c.lid}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      dbg.mesh.visible = false; pitch.rotation.x = 0;
      return out.toDataURL('image/png');
    },
  };
  window.__ready = true;
  if (!shot) {
    let last = performance.now(), next = 0.8, mirror = false;
    const go = () => { if (!tongue.busy) { tongue.lick({ ...lickOpts, mirror }); mirror = false; } };
    canvas.addEventListener('pointerdown', go);
    addEventListener('keydown', (e) => { if (e.key === ' ') go(); if (e.key === 'm') mirror = true; });
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      tick(dt);
      if (!frozen && clock >= next) { next = clock + 4.2; go(); }
      render();
      hud.textContent = `t=${clock.toFixed(2)} ${tongue.busy ? 'licking' : ''}  lid ${(-pitch.rotation.x).toFixed(3)}`;
    })(last);
  } else render();
</script>
</body>
</html>
