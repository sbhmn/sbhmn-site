<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBHMN lab: tongue</title>
<!-- Test bench for assets/intro/tongue.js (not linked from the site): the intro's bin (lid open, as during the throw)
     with the monster's tongue, seen from the throw camera and the front camera, side by side.
     /dev/lab-tongue.html                 live: licks every 3.2 s; click or space to lick now, M mirrors the next one
     ?view=both | throw | front | side    which camera(s) (default both, side by side; side: from the right, debugging)
     &shot                                don't run the loop: dev/tongue-shot.cjs steps it with __stage.advance(s);
                                          the lick starts at scene time &at (default 0.1)
     &speed=1  &mirror  &spread=1         lick options (spread defaults to the intro's suggested formula from the aspect)
     &fps=20                              step the shot at 20 fps (a slow phone) instead of 60 (the lick starts exactly at
                                          &at either way, so frames with the same label match across frame rates)
     &fxscene                             the drips live in the scene (opts.fxParent = scene), as the intro should do it
     &nowarm                              skip tongue.warm() (to measure the first-lick stall)
     look development: &probe (spheres in the tongue's own studio light: mirror, smooth, faceted), &normals (the
     tongue with normal colours), &tm=clearcoat:0,specularIntensity:0 (override tongue material numbers)
     dev/tongue-shot.cjs <prefix> <t1,t2,...> [--view ..] [--size WxH] [--sheet cols --cell px] [--q "mirror&fps=20"] -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 monospace; color: #888; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas></canvas>
<div class="hud"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '/assets/vendor/three/addons/loaders/GLTFLoader.js';
  import { createTongue } from '/assets/intro/tongue.js';
  const q = new URLSearchParams(location.search);
  const mode = q.get('view') ?? 'both';
  const views = mode === 'both' ? ['throw', 'front'] : mode === 'three' ? ['throw', 'front', 'side'] : [mode];
  const shot = q.has('shot'), lickAt = +(q.get('at') ?? 0.1);
  const canvas = document.querySelector('canvas');
  const hud = document.querySelector('.hud');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a9a, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(-2.2, 5, 3.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 12 });
  sun.shadow.radius = 4;
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.13 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // the bin, as intro.js builds it, lid open (the throw)
  const gltf = await new GLTFLoader().loadAsync('/assets/3d/bin.glb');
  const binMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.75, metalness: 0, flatShading: true });
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
  const bin = new THREE.Group();
  scene.add(bin);
  const parts = {};
  gltf.scene.traverse((o) => { if (o.isMesh) parts[o.name] = o; });
  for (const name of ['body', 'rim', 'base', 'wheels', 'inside']) {
    const m = parts[name]; if (!m) continue;
    m.material = name === 'inside' ? voidMat : binMat;
    m.castShadow = name !== 'inside'; m.receiveShadow = true;
    bin.add(m);
  }
  const lidMesh = parts.lid;
  const pitch = new THREE.Group(); pitch.position.copy(lidMesh.position); bin.add(pitch);
  lidMesh.position.set(0, 0, 0); lidMesh.material = binMat; lidMesh.castShadow = true; pitch.add(lidMesh);
  const lining = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.98), new THREE.MeshBasicMaterial({ color: 0, side: THREE.DoubleSide }));
  lining.rotation.x = Math.PI / 2; lining.position.set(0, -0.002, 0.5); lidMesh.add(lining);
  pitch.rotation.x = -1.9;

  // the tongue
  const cues = [];
  const tongue = createTongue(THREE, { rimY: 0.78, fxParent: q.has('fxscene') ? scene : null, onCue: (name, info) => { if (name !== 'splat') cues.push(`${(clock - lickAt).toFixed(2)} ${name}`); } });
  bin.add(tongue.object3d);
  tongue.object3d.position.set(0, 0.78, 0);
  const body = tongue.object3d.getObjectByName('tongue-body');

  if (q.has('normals')) body.material = new THREE.MeshNormalMaterial();
  // &tm=clearcoat:0,envMapIntensity:0 : override tongue material numbers (look development)
  if (q.get('tm')) { const m = body.material; for (const kv of q.get('tm').split(',')) { const [k, v] = kv.split(':'); m[k] = +v; } m.needsUpdate = true; }
  // &probe: spheres lit like the tongue (its own studio env): a mirror, the tongue's material, a facetted one
  if (q.has('probe')) {
    const tm = body.material;
    const mirror = new THREE.Mesh(new THREE.SphereGeometry(0.22, 48, 24), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.02, envMap: tm.envMap }));
    const red = new THREE.Mesh(new THREE.SphereGeometry(0.22, 48, 24), tm.clone());
    red.material.vertexColors = false; red.material.color.set(0x7e0b15); red.material.onBeforeCompile = tm.onBeforeCompile; red.material.customProgramCacheKey = () => 'probe-red';
    const facet = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 2), red.material.clone());
    facet.material.flatShading = true; facet.material.onBeforeCompile = tm.onBeforeCompile; facet.material.customProgramCacheKey = () => 'probe-facet';
    mirror.position.set(-1.0, 1.0, 0.6); red.position.set(1.0, 1.0, 0.6); facet.position.set(1.0, 0.35, 0.8);
    scene.add(mirror, red, facet);
  }

  // cameras (intro.js's view.throw / view.front)
  const MARK = { left: -0.62, right: 0.6213, top: 1.076, bottom: -0.0773 };
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  function place(name, aspect) {
    camera.aspect = aspect;
    if (name === 'throw') {
      const fov = 40, base = 3.9;
      const fit = 1.9 / (2 * base * Math.tan(THREE.MathUtils.degToRad(fov / 2)) * aspect);
      const d = base * Math.max(1, fit);
      camera.position.set(0, 0.5, 0).addScaledVector(new THREE.Vector3(0, 1.25, 3.7).normalize(), d);
      camera.fov = fov; camera.lookAt(0, 0.5, 0);
    } else if (name === 'side') {
      camera.fov = 30; camera.position.set(6.5, 1.0, 0.6); camera.lookAt(0, 0.7, 0.6);
    } else {
      const fov = 18, t = 2 * Math.tan(THREE.MathUtils.degToRad(fov / 2));
      const h = MARK.top - MARK.bottom, w = MARK.right - MARK.left;
      const d = Math.max(h / 0.5 / t, w / 0.62 / (t * aspect));
      const cy = (MARK.top + MARK.bottom) / 2;
      camera.position.set(0, cy, d); camera.fov = fov; camera.lookAt(0, cy, 0);
    }
    camera.updateProjectionMatrix();
  }
  function render() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const n = views.length, cw = Math.floor(w / n);
    renderer.setScissorTest(n > 1);
    views.forEach((v, k) => {
      renderer.setViewport(k * cw, 0, cw, h); renderer.setScissor(k * cw, 0, cw, h);
      place(v, cw / h);
      renderer.render(scene, camera);
    });
  }
  function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
  window.addEventListener('resize', resize); resize();
  if (!q.has('nowarm')) { place(views[0], canvas.clientWidth / views.length / canvas.clientHeight); tongue.warm(renderer, camera); }

  let clock = 0, started = false;
  const lickOpts = { speed: +(q.get('speed') ?? 1), mirror: q.has('mirror'), spread: q.has('spread') ? +q.get('spread') : Math.min(1, 0.55 + 0.45 * innerWidth / views.length / innerHeight) };
  function tick(dt) {
    // in a shot the lick starts exactly at lickAt (the step is split there), so t is the same at any frame rate
    if (shot && !started && clock + dt >= lickAt - 1e-9) {
      const a = Math.max(0, lickAt - clock);
      tongue.update(a); clock += a; dt -= a;
      started = true; tongue.lick(lickOpts);
    }
    clock += dt;
    tongue.update(dt);
  }
  window.__stage = {
    tongue, cues,
    get clock() { return clock; },
    advance(s) { const f = +(q.get('fps') ?? 60), n = Math.round(s * f); for (let i = 0; i < n; i++) tick(1 / f); render(); }, // &fps=20: a slow phone
    // a contact sheet: one cell per moment (scene times, ascending), returned as a PNG data URL
    sheet(times, cols = 4, cellW = 480) {
      const w = canvas.width, h = canvas.height, cellH = Math.round(cellW * h / w);
      const rows = Math.ceil(times.length / cols);
      const out = document.createElement('canvas'); out.width = cols * cellW; out.height = rows * cellH;
      const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height);
      times.forEach((t, k) => {
        this.advance(t - clock);
        x.drawImage(canvas, (k % cols) * cellW, Math.floor(k / cols) * cellH, cellW, cellH);
        x.fillStyle = '#999'; x.font = '13px monospace'; x.fillText(`t=${(t - lickAt).toFixed(2)}`, (k % cols) * cellW + 6, Math.floor(k / cols) * cellH + 16);
        x.strokeStyle = '#ddd'; x.strokeRect((k % cols) * cellW + 0.5, Math.floor(k / cols) * cellH + 0.5, cellW - 1, cellH - 1);
      });
      return out.toDataURL('image/png');
    },
  };
  window.__ready = true;
  if (!shot) {
    let last = performance.now(), next = 0.6, mirror = false;
    const go = () => { if (!tongue.busy) { tongue.lick({ ...lickOpts, mirror: mirror || lickOpts.mirror }); mirror = false; } };
    canvas.addEventListener('pointerdown', go);
    addEventListener('keydown', (e) => { if (e.key === ' ') go(); if (e.key === 'm') mirror = true; });
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      tick(dt);
      if (clock >= next) { next = clock + 3.2; go(); }
      render();
      hud.textContent = `t=${clock.toFixed(2)} ${tongue.busy ? 'licking' : ''}`;
    })(last);
  } else render();
</script>
</body>
</html>
