<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBHMN lab: drips</title>
<!-- Drips lab (not linked from the site): spit on the screen, assets/intro/drips.js, over a chosen background.
     /dev/lab-drips.html                 white page; sprays on load, click to splat, S to spray, F to dry it all up
     ?bg=white | home | live | image | intro
                                         home: the home page print (assets/img/paper-*.webp) drawn full window and given
                                         to the drips as their refraction source; live: the real home page in an iframe
                                         (no source: see-through drops); image: a busy picture (wsw-key.webp) as source;
                                         intro: the real intro in an iframe (/?debug), thrown and stepped to &at=9.42 s
                                         (the spit), then stepped in lockstep with the drips: spit over the bin and the
                                         unfolding paper (see-through)
     &src=0                              don't give the drips the picture (test the see-through look over it)
     &seed=7 &n=10                       randomness and how many splats
     &from=x,y                           where the spit comes from on screen, CSS px (default: the cluster's centre)
     &fade=2.5 &fadems=1400              (with &shot) start drips.fadeOut at that time
     &float=0                            force the 8-bit water map (the fallback)
     &rm=1                               reduced motion
     &one=100                            (with &shot) one head-on splat of that size in the middle instead of a spray
     &goo=200                            (with &shot) a gob of goo of that size a little above the middle instead
     &gpu=1                              (with &shot) __perf() includes the GPU: readPixels after every update
     &shot                               don't run: dev/drips-shot.cjs steps it with await __stage.advance(s) -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .hint { position: fixed; left: 12px; bottom: 10px; font: 12px/1.3 system-ui, sans-serif; color: #999; z-index: 1; }
</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
  import { createDrips } from '/assets/intro/drips.js';
  const q = new URLSearchParams(location.search);
  const bg = q.get('bg') ?? 'white';
  const seed = +(q.get('seed') ?? 7);
  const n = +(q.get('n') ?? 10);
  const shot = q.has('shot');
  const from = q.get('from') ? q.get('from').split(',').map(Number) : undefined;
  const W = innerWidth, H = innerHeight;

  const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  async function cover(src) {
    const img = await load(src);
    const c = document.createElement('canvas'); c.id = 'bg';
    const d = Math.min(devicePixelRatio || 1, 2);
    c.width = Math.round(W * d); c.height = Math.round(H * d);
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    const s = Math.max(c.width / img.naturalWidth, c.height / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    x.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
    document.body.prepend(c);
    return c;
  }

  let source = null, intro = null;
  window.__ready = (async () => {
    if (bg === 'home') source = await cover(W / H >= 1 ? '/assets/img/paper-desktop.webp' : '/assets/img/paper-phone.webp');
    else if (bg === 'image') source = await cover('/assets/img/wsw-key.webp');
    else if (bg === 'live') {
      try { sessionStorage.setItem('sbhmn-intro', 'done'); } catch (e) {}
      const f = document.createElement('iframe'); f.src = '/'; document.body.prepend(f);
      await new Promise((r) => f.addEventListener('load', r, { once: true }));
      await new Promise((r) => setTimeout(r, 1500));
    } else if (bg === 'intro') {
      try { sessionStorage.removeItem('sbhmn-intro'); } catch (e) {}
      const f = document.createElement('iframe'); f.src = '/?debug'; document.body.prepend(f);
      await new Promise((r) => f.addEventListener('load', r, { once: true }));
      for (let i = 0; i < 200 && !f.contentWindow.__intro; i++) await new Promise((r) => setTimeout(r, 100));
      intro = f.contentWindow.__intro;
      if (!intro) throw new Error('no window.__intro in the iframe');
      intro.throwBall(0, 3.35, -3.35);
      await intro.advance(+(q.get('at') ?? 9.42));
    }
    if (q.get('src') === '0') source = null;
    const float = q.get('float') !== '0';
    const reducedMotion = q.get('rm') === '1';
    const make = (s) => createDrips({ seed: s, auto: !shot, source, float, reducedMotion });
    let drips = make(seed);
    if (shot) {
      // &one=100: a single splat of that size in the middle, hit head-on (to measure the size); else a spray
      if (q.has('one')) drips.splat(W / 2, H / 2, +q.get('one'), { dir: [0, 0] });
      else if (q.has('goo')) drips.goo(W / 2, H * 0.42, +q.get('goo'), { dir: [0, 0] });
      else drips.spray(n, undefined, { from });
      // &gpu=1: wait for the GPU after every update (readPixels), so __perf times the GPU work too
      const sync = q.get('gpu') === '1' && drips.canvas ? drips.canvas.getContext('webgl2') : null;
      const px = new Uint8Array(4);
      // &fade=2.5: dry it all up from 2.5 s (fadeOut(&fadems=1400))
      const fadeAt = q.has('fade') ? +q.get('fade') : Infinity, fadeMs = +(q.get('fadems') ?? 1400);
      let t = 0; const perf = [];
      window.__perf = () => { const a = perf.slice().sort((x, y) => x - y); return { frames: a.length, median: a[a.length >> 1], p95: a[Math.floor(a.length * 0.95)], alive: drips.alive }; };
      window.__stage = { async advance(s) {
        let left = s;
        do {
          const h = Math.min(left, 1 / 60);
          if (t < fadeAt && t + h >= fadeAt) drips.fadeOut(fadeMs).then(() => { window.__faded = t; });
          if (intro) await intro.advance(h);
          const t0 = performance.now(); drips.update(h);
          if (sync && !sync.isContextLost()) sync.readPixels(0, 0, 1, 1, sync.RGBA, sync.UNSIGNED_BYTE, px);
          perf.push(performance.now() - t0); t += h; left -= h;
        } while (left > 1e-6);
      } };
      window.__drips = drips;
      drips.update(0);
    } else {
      drips.spray(n, undefined, { from });
      document.body.insertAdjacentHTML('beforeend', '<div class="hint">click: splat · S: spray · F: dry up · R: new</div>');
      // the overlay removes itself once everything has dried: make a new one when needed
      const live = () => { if (!drips.canvas || !drips.canvas.isConnected) drips = make((Math.random() * 1e9) | 0); window.__drips = drips; return drips; };
      addEventListener('pointerdown', (e) => live().splat(e.clientX, e.clientY, Math.min(W, H) * (0.04 + Math.random() * 0.09)));
      addEventListener('keydown', async (e) => {
        if (e.key === 's') live().spray(n, undefined, { from });
        if (e.key === 'f') await drips.fadeOut(1400);
        if (e.key === 'r') { drips.dispose(); live().spray(n, undefined, { from }); }
      });
      window.__drips = drips;
    }
    return true;
  })().catch((e) => { document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;left:8px;top:8px;z-index:99;color:#a00">${e.stack}</pre>`); throw e; });
</script>
</body>
</html>
